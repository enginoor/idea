name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Newer pushes supersede older runs on the same branch, so a stale run never
# keeps burning macOS runner time after a fix has already been pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: "6.0.3"
      # actions/cache compresses with zstd when it is installed, roughly
      # halving the upload/restore time for the multi-hundred-MB .build dir.
      - name: Install zstd for fast cache compression
        run: sudo apt-get update -y && sudo apt-get install -y zstd
      - name: Restore the Swift build cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .build
          key: swiftpm-linux-${{ github.sha }}
          restore-keys: swiftpm-linux-
      - name: Run the engine test suite
        run: swift test
      - name: Save the Swift build cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .build
          key: swiftpm-linux-${{ github.sha }}

  test-and-build-macos:
    name: Engine tests and app build (macOS)
    # Runs on macos-15 (Apple Silicon, Xcode 16). The macos-14 image
    # (Intel, Xcode 15.4) requires a separate swift.org 6.0.3 toolchain, and
    # in that combination `swift test` deterministically hangs inside xctest
    # with no test output, cancelling the job at its timeout on every run.
    # The same suite passed on macos-15, so the runner image is the variable.
    # The minimum deployment target is still enforced by the package manifest
    # (platforms: [.macOS(.v14)]), so the build gate is not weakened.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: "6.0.3"
      - name: Install zstd for fast cache compression
        run: command -v zstd >/dev/null 2>&1 || brew install zstd
      # Cache the engine's .build (swift test) and the app's .build (the
      # Sparkle binary artifact plus compiled modules) so a push right after a
      # green run builds incrementally instead of from scratch. The key
      # prefix is shared with the Release workflow, so a release reuses the
      # freshest cache either run has saved.
      - name: Restore the Swift build caches
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            .build
            App/.build
          key: swiftpm-macos-${{ github.sha }}
          restore-keys: swiftpm-macos-
      - name: Run the engine test suite
        run: swift test
      # Release config, not debug: this gates on exactly the configuration
      # that ships in the DMG, which is the configuration the Release
      # workflow builds anyway. The swift.org 6.0.3 compiler crashes in
      # IRGen ("Failed to reconstruct type") on the @State AppState property
      # in the App struct when emitting DWARF debug info, and release builds
      # do include debug info on Apple platforms. The App package disables
      # the debug-info round-trip check (-disable-round-trip-debug-types,
      # the workaround the compiler itself suggests) so the build survives.
      - name: Build the macOS app (release config)
        run: cd App && swift build -c release
      - name: Save the Swift build caches
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .build
            App/.build
          key: swiftpm-macos-${{ github.sha }}
