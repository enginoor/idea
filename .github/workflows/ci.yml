name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Run the engine test suite
        run: swift test

  test-and-build-macos:
    name: Engine tests and app build (macOS)
    # The app targets macOS 14, and building on the minimum supported OS
    # catches accidental use of newer APIs. macos-14 is also a separate
    # runner image from macos-15, so a degraded macos-15 image cannot
    # silently take the whole pipeline down.
    #
    # The macos-14 image ships Swift 5.10, which cannot build a Swift 6.0
    # tools-version package, so the Swift 6.0.3 toolchain is installed
    # explicitly, matching the Linux job.
    runs-on: macos-14
    # Generous on purpose: on a cold runner, the Swift 6.0.3 toolchain
    # download plus the engine build plus the app build took longer than
    # the previous 15-minute bound, so GitHub cancelled the job mid-test
    # and the macOS gate silently never ran. 30 minutes clears it with room
    # to spare while still failing fast on a genuinely stuck job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Run the engine test suite
        run: swift test
      - name: Build the macOS app
        run: cd App && swift build
