name: CI

on:
  push:
    # main only: tag pushes (which the Auto-release workflow creates) and
    # docs/appcast-only commits do not need a full CI run.
    branches: [main]
    paths-ignore:
      - "**.md"
      - "appcast.xml"
      - "assets/**"
  pull_request:
  workflow_dispatch:

# Newer pushes supersede older runs on the same branch, so a stale run never
# keeps burning macOS runner time after a fix has already been pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: "6.0.3"
      # Cache poisoning guard: a rebuilt swift.org artifact (or a runner
      # image change) invalidates cached .build products even though the
      # "6.0.3" version string is unchanged. Hash the actual toolchain
      # binary so a cache saved under a different toolchain is never
      # restored; a mismatch just means one cold build.
      - name: Compute the Swift toolchain fingerprint
        id: toolchain
        run: |
          if command -v shasum >/dev/null 2>&1; then
            SWIFT_HASH="$(shasum -a 256 "$(command -v swift)" | awk '{print $1}' | cut -c1-16)"
          else
            SWIFT_HASH="$(sha256sum "$(command -v swift)" | awk '{print $1}' | cut -c1-16)"
          fi
          echo "fingerprint=${SWIFT_HASH}" >> "${GITHUB_OUTPUT}"
      # actions/cache compresses with zstd when it is installed, roughly
      # halving the upload/restore time for the multi-hundred-MB .build dir.
      - name: Install zstd for fast cache compression
        run: sudo apt-get update -y && sudo apt-get install -y zstd
      - name: Restore the Swift build cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .build
          key: swiftpm-linux-${{ steps.toolchain.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: swiftpm-linux-${{ steps.toolchain.outputs.fingerprint }}-
      - name: Run the engine test suite
        run: swift test
      - name: Save the Swift build cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .build
          key: swiftpm-linux-${{ steps.toolchain.outputs.fingerprint }}-${{ github.sha }}

  test-and-build-macos:
    name: Engine tests and app build (macOS)
    # Runs on macos-15 (Apple Silicon, Xcode 16). Uses native Xcode Swift to
    # avoid XCTestCore framework path mismatches from swift.org toolchain overrides.
    # The minimum deployment target is still enforced by the package manifest
    # (platforms: [.macOS(.v14)]), so the build gate is not weakened.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Cache poisoning guard: hash the actual swift binary and Xcode version.
      # runner images rotate Xcode) without the "6.0.3" version string
      # changing, which silently invalidates cached .build products (test
      # bundles dlopen-fail on @rpath/XCTestCore.framework). Hash the actual
      # swift binary and Xcode version so a cache saved under a different
      # toolchain is never restored; a mismatch just means one cold build.
      - name: Compute the Swift toolchain fingerprint
        id: toolchain
        run: |
          SWIFT_HASH="$(shasum -a 256 "$(command -v swift)" | awk '{print $1}' | cut -c1-16)"
          XCODE_HASH="$(xcodebuild -version 2>/dev/null | head -2 | tr -d '\n' | shasum -a 256 | awk '{print $1}' | cut -c1-8 || echo none)"
          echo "fingerprint=${SWIFT_HASH}-${XCODE_HASH}" >> "${GITHUB_OUTPUT}"
      - name: Install zstd for fast cache compression
        run: command -v zstd >/dev/null 2>&1 || brew install zstd
      # Cache the engine's .build (swift test) and the app's .build (the
      # Sparkle binary artifact plus compiled modules) so a push right after a
      # green run builds incrementally instead of from scratch. The key
      # prefix is shared with the Release workflow, so a release reuses the
      # freshest cache either run has saved. The toolchain fingerprint is
      # part of the key so a cache from a different toolchain is never
      # restored (see the poisoning guard above).
      - name: Restore the Swift build caches
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            .build
            App/.build
          key: swiftpm-macos-${{ steps.toolchain.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: swiftpm-macos-${{ steps.toolchain.outputs.fingerprint }}-
      - name: Run the engine test suite
        run: swift test
      # Release config, not debug: this gates on exactly the configuration
      # that ships in the DMG, which is the configuration the Release
      # workflow builds anyway. The swift.org 6.0.3 compiler crashes in
      # IRGen ("Failed to reconstruct type") on the @State AppState property
      # in the App struct when emitting DWARF debug info, and release builds
      # do include debug info on Apple platforms. The App package disables
      # the debug-info round-trip check (-disable-round-trip-debug-types,
      # the workaround the compiler itself suggests) so the build survives.
      - name: Build the macOS app (release config)
        run: cd App && swift build -c release
      - name: Save the Swift build caches
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .build
            App/.build
          key: swiftpm-macos-${{ steps.toolchain.outputs.fingerprint }}-${{ github.sha }}
